<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Surefire Lead Clipper</title>
  <style>
    body { width: 280px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 14px; color: #1e293b; background: #f8fafc; }
    h3 { margin: 0 0 6px; font-size: 15px; color: #0f2b4a; }
    p { margin: 0 0 10px; font-size: 12px; color: #64748b; line-height: 1.4; }
    label { display: block; font-size: 11px; font-weight: 700; color: #334155; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 12px; margin-bottom: 10px; }
    button { width: 100%; padding: 8px; background: #0f2b4a; color: white; border: none; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
    button:hover { background: #1e3a5f; }
    .badge { display: inline-block; background: #dcfce7; color: #166534; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 600; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h3>Surefire Social Lead Clipper</h3>
  <span class="badge">Facebook Group 实时智能捕获</span>
  <p>在 Facebook 帖子中选中文字，右键点击<strong>「🚀 发送到 Surefire 水暖工作台」</strong>即可秒级录入与 AI 打分。</p>

  <label for="serverUrl">工作台地址 (Server URL):</label>
  <input type="text" id="serverUrl" placeholder="http://localhost:3000">

  <button id="saveBtn">保存配置</button>

  <script>
    const input = document.getElementById('serverUrl');
    chrome.storage.sync.get(['serverUrl'], (res) => {
      input.value = res.serverUrl || 'http://localhost:3000';
    });
    document.getElementById('saveBtn').addEventListener('click', () => {
      chrome.storage.sync.set({ serverUrl: input.value.trim() }, () => {
        alert('配置已保存！支持 localhost:3000 或您部署在 Vercel 上的线上地址。');
        window.close();
      });
    });
  </script>
</body>
</html>
